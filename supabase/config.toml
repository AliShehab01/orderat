# Supabase project config, read locally by `deno check` / `supabase functions deploy --use-api
# --project-ref <ref>` (see README.md "Hosting"). Orderat is hosted inside the founder's existing
# "Hayati" project, not a project of its own, and hosting:* scripts always pass --project-ref
# explicitly rather than relying on `supabase link` — a link would point the whole CLI, including
# `supabase db push`, at Hayati, which is exactly what db/migrations (outside the CLI's managed
# supabase/migrations folder) exists to avoid. This placeholder just lets the CLI recognise a project
# locally without ever linking one.
project_id = "orderat"

# Meta's webhook POSTs (WhatsApp, Instagram) and the owner page's ?key= sign-in carry no Supabase
# JWT, only Meta's own X-Hub-Signature-256 / the app's OWNER_KEY — both checked inside the function
# itself (server/meta/verify.ts, server/owner/auth.ts). verify_jwt=false only turns off Supabase's
# own gateway-level "Authorization: Bearer <supabase jwt>" requirement; it does not mean the
# function is otherwise unauthenticated.
#
# Functions are named with an "orderat-" prefix because this project (Hayati) hosts more than just
# Orderat — see README.md "Hosting" for the isolation contract.
[functions.orderat-whatsapp]
verify_jwt = false

[functions.orderat-instagram]
verify_jwt = false

[functions.orderat-owner]
verify_jwt = false
